name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import mapped galleon sprite from TQ
        run: |
          mkdir -p public/assets/ships
          curl --fail --location --retry 3 --output public/assets/ships/starter-galleon.png 'https://raw.githubusercontent.com/juliano-souza-dev/TQ/main/assets/ships/Sprite%20Sheet%20de%20Gale%C3%B5es%20Piratas%20em%20Fundo%20Transparente%20%282%29.png'
      - name: Import illustrated islands from TQ
        run: |
          mkdir -p public/assets/islands
          for asset in ilha_estaleiro.webp ilha_missoes.webp ilha_fundo_transparente.png; do
            curl --fail --location --retry 3 --output "public/assets/islands/$asset" "https://raw.githubusercontent.com/juliano-souza-dev/TQ/main/assets/regions/islands/$asset"
          done
      - name: Import original TQ WebGL2 ocean renderer and texture
        run: |
          mkdir -p public/tq-renderer public/assets/ocean
          curl --fail --location --retry 3 -o public/tq-renderer/LegacyOceanWebGLRenderer.mjs 'https://raw.githubusercontent.com/juliano-souza-dev/TQ/main/src/rendering/LegacyOceanWebGLRenderer.mjs'
          curl --fail --location --retry 3 -o public/assets/ocean/tile.webp 'https://raw.githubusercontent.com/juliano-souza-dev/TQ/main/assets/globals/ocean-tile-tabuada-region01.webp'
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
