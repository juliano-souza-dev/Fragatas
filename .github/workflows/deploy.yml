name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import mapped galleon sprite from TQ
        run: |
          mkdir -p public/assets/ships
          curl --fail --location --retry 3 --output public/assets/ships/starter-galleon.png 'https://raw.githubusercontent.com/juliano-souza-dev/TQ/main/assets/ships/Sprite%20Sheet%20de%20Gale%C3%B5es%20Piratas%20em%20Fundo%20Transparente%20%282%29.png'
      - run: npm install
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
