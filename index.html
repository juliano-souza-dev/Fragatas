<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"/><meta http-equiv="Pragma" content="no-cache"/><meta name="theme-color" content="#071b29"/><meta name="mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-capable" content="yes"/><link rel="manifest" href="/Fragatas/manifest.webmanifest"/><link rel="icon" type="image/svg+xml" href="/Fragatas/icon.svg"/><title>Fragatas</title></head><body><div id="app"></div><script>
(async()=>{
 if('serviceWorker' in navigator){
  for(const registration of await navigator.serviceWorker.getRegistrations())await registration.unregister();
 }
 if('caches' in window){
  for(const key of await caches.keys())if(key.includes('fragatas')||key.includes('Fragatas'))await caches.delete(key);
 }
 try{
  const response=await fetch('/Fragatas/version.json?t='+Date.now(),{cache:'no-store'});
  if(!response.ok)return;
  const version=(await response.json()).version;
  const key='fragatas-deploy-version';
  const previous=sessionStorage.getItem(key);
  if(previous&&previous!==version){sessionStorage.setItem(key,version);location.replace('/Fragatas/?v='+encodeURIComponent(version));return;}
  sessionStorage.setItem(key,version);
 }catch(error){console.warn('Version check unavailable',error);}
})();
</script><script type="module" src="/src/main.ts"></script></body></html>
